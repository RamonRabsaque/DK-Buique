<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Dados - DK Telecom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f6f8;
            padding: 20px;
            color: #1a1a2e;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 24px;
            overflow: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .header h1 span {
            color: #2a5a8c;
        }

        .header .info {
            font-size: 13px;
            color: #6e7681;
            background: #f0f2f5;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .btn-voltar {
            background: #1a3a5c;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-voltar:hover {
            background: #0f2a4a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 58, 92, 0.3);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 1100px;
        }

        thead th {
            position: sticky;
            top: 0;
            padding: 10px 8px;
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1a1a2e;
            z-index: 10;
            text-align: center;
            border-bottom: 2px solid #0f2a4a;
        }

        /* Cores das colunas - iguais ao Excel */
        thead th:nth-child(1) { background: #DCE6F1; }  /* # */
        thead th:nth-child(2) { background: #DCE6F1; }  /* Vencimento */
        thead th:nth-child(3) { background: #DCE6F1; }  /* Cliente */
        thead th:nth-child(4) { background: #D9EAD3; }  /* Mensalidade */
        thead th:nth-child(5) { background: #DCE6F1; }  /* Instalador */
        thead th:nth-child(6) { background: #D9EAD3; }  /* Instalação */
        thead th:nth-child(7) { background: #F4B6C1; }  /* Despesas */
        thead th:nth-child(8) { background: #F4B6C1; }  /* Valor Despesa */
        thead th:nth-child(9) { background: #DCE6F1; }  /* Dinheiro */
        thead th:nth-child(10) { background: #DCE6F1; } /* PIX/Cartão */
        thead th:nth-child(11) { background: #DCE6F1; } /* Usuário */
        thead th:nth-child(12) { background: #DCE6F1; } /* Ações */

        tbody td {
            padding: 8px 6px;
            border-bottom: 1px solid #eef0f4;
            vertical-align: middle;
            text-align: center;
            font-size: 11px;
        }

        tbody td:nth-child(3) { text-align: left; font-weight: 600; }

        /* Cores das linhas de dados */
        tbody td:nth-child(1) { background: #DCE6F1; }
        tbody td:nth-child(2) { background: #DCE6F1; }
        tbody td:nth-child(3) { background: #DCE6F1; }
        tbody td:nth-child(4) { background: #D9EAD3; }
        tbody td:nth-child(5) { background: #DCE6F1; }
        tbody td:nth-child(6) { background: #D9EAD3; }
        tbody td:nth-child(7) { background: #F4B6C1; }
        tbody td:nth-child(8) { background: #F4B6C1; }
        tbody td:nth-child(9) { background: #DCE6F1; }
        tbody td:nth-child(10) { background: #DCE6F1; }
        tbody td:nth-child(11) { background: #DCE6F1; }
        tbody td:nth-child(12) { background: #DCE6F1; }

        .valor-green { color: #1a7a3a; font-weight: 600; }
        .valor-red { color: #bc4e2c; font-weight: 600; }

        .tag-recibo {
            display: inline-block;
            font-size: 7px;
            font-weight: 600;
            color: #2a5a8c;
            background: transparent;
            padding: 0 4px;
            border: 1px solid #2a5a8c;
            border-radius: 3px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-left: 6px;
            opacity: 0.7;
        }

        .row-recibo td {
            background: #f0f5ff !important;
        }
        .row-recibo td:first-child {
            border-left: 3px solid #2a5a8c;
        }
        .row-recibo:hover td {
            background: #e5edf8 !important;
        }

        .btn-excluir-linha {
            background: none;
            border: none;
            color: #bc4e2c;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.3s ease;
            opacity: 0.5;
        }
        .btn-excluir-linha:hover {
            opacity: 1;
            background: #fce8e5;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8a8a9a;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef0f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: #6e7681;
        }
        .footer .total { font-weight: 600; color: #1a1a2e; }
        .footer .total span { color: #2a5a8c; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .container { padding: 16px; }
            .header h1 { font-size: 18px; }
            table { font-size: 10px; min-width: 800px; }
            thead th, tbody td { padding: 6px 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 <span>Visualizar</span> Dados</h1>
            </div>
            <div>
                <span class="info" id="infoRegistros">0 registros</span>
                <button class="btn-voltar" onclick="window.close()">
                    <span class="icon">✕</span> Fechar
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width:5%;">#</th>
                        <th style="width:10%;">Vencimento</th>
                        <th style="width:22%;">Cliente</th>
                        <th style="width:10%;">Mensalidade</th>
                        <th style="width:12%;">Instalador</th>
                        <th style="width:10%;">Instalação</th>
                        <th style="width:12%;">Despesas</th>
                        <th style="width:10%;">Valor Desp.</th>
                        <th style="width:6%;">Dinheiro</th>
                        <th style="width:8%;">PIX/Cartão</th>
                        <th style="width:10%;">Usuário</th>
                        <th style="width:6%;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <div class="footer">
            <div>
                📅 <strong id="dataCarregamento"></strong>
            </div>
            <div class="total">
                Total: <span id="totalRegistros">0</span> registros
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Data de carregamento
            const agora = new Date();
            document.getElementById('dataCarregamento').textContent = 'Carregado em: ' + agora.toLocaleString('pt-BR');

            // Carregar dados do localStorage (chave correta)
            const cidadeAtual = localStorage.getItem('dk_cidade_atual') || 'buique';
            const chavePlanilha = `dk_${cidadeAtual}_dados_planilha`;
            
            let dados = [];
            try {
                const dadosSalvos = localStorage.getItem(chavePlanilha);
                if (dadosSalvos) {
                    dados = JSON.parse(dadosSalvos);
                }
            } catch (e) {
                console.error('Erro ao carregar dados:', e);
            }

            // Atualizar informações
            document.getElementById('infoRegistros').textContent = dados.length + ' registros';
            document.getElementById('totalRegistros').textContent = dados.length;

            // Renderizar tabela
            const tbody = document.getElementById('tbody');

            if (dados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="12">
                            <div class="empty-state">
                                <div class="icon">📭</div>
                                <h2>Nenhum dado encontrado</h2>
                                <p>Adicione registros na planilha principal e clique em "Visualizar" novamente.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            function formatarMoeda(valor) {
                if (valor === undefined || valor === null || valor == 0) return 'R$ 0,00';
                return 'R$ ' + parseFloat(valor).toFixed(2).replace('.', ',');
            }

            function formatarData(dataStr) {
                if (!dataStr) return '';
                let partes = dataStr.split('-');
                if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
                return dataStr;
            }

            function getUsuarioNome(id) {
                if (!id) return 'Sistema';
                try {
                    const usuarios = JSON.parse(localStorage.getItem('dk_usuarios') || '[]');
                    const user = usuarios.find(u => u.id === id);
                    return user ? user.nome || user.login : 'Sistema';
                } catch (e) { return 'Sistema'; }
            }

            let html = '';
            let index = 0;

            for (let item of dados) {
                index++;
                let isRecibo = item.origem === 'recibo';
                let classeRecibo = isRecibo ? 'class="row-recibo"' : '';
                let clienteNome = item.cliente || '';

                let isDinheiro = false;
                let isPixCartao = false;

                if (item.pagamentoParcial) {
                    isDinheiro = (item.valorDinheiro || 0) > 0;
                    isPixCartao = (item.valorPix || 0) > 0 || (item.valorCartao || 0) > 0;
                } else {
                    isDinheiro = (item.metodoPagamento === 'Dinheiro');
                    isPixCartao = (item.metodoPagamento === 'PIX' || item.metodoPagamento === 'Cartão');
                }

                let dinheiroMark = isDinheiro ? 'X' : '';
                let pixMark = isPixCartao ? 'X' : '';
                let usuarioNome = item.usuarioId ? getUsuarioNome(item.usuarioId) : (item.usuario || 'Sistema');

                let tags = '';
                if (isRecibo) tags += '<span class="tag-recibo">Recibo</span>';

                html += `<tr ${classeRecibo}>
                    <td>${index}</td>
                    <td>${formatarData(item.vencimento) || '—'}</td>
                    <td style="font-weight:${clienteNome ? '700' : '400'};">
                        ${clienteNome}
                        ${tags}
                    </td>
                    <td class="valor-green">${formatarMoeda(item.mensalidade)}</td>
                    <td>${item.instalador || '—'}</td>
                    <td class="valor-green">${formatarMoeda(item.instalacao)}</td>
                    <td style="font-weight:700;">${item.despesas || '—'}</td>
                    <td class="valor-red">${formatarMoeda(item.valorDespesa)}</td>
                    <td style="font-weight:700; color:#1a7a3a;">${dinheiroMark}</td>
                    <td style="font-weight:700; color:#2a5a8c;">${pixMark}</td>
                    <td style="font-size:9px; color:#8a8a9a;">${escapeHtml(usuarioNome)}</td>
                    <td>
                        <button class="btn-excluir-linha" onclick="excluirItem(${dados.indexOf(item)})" title="Excluir">
                            🗑️
                        </button>
                    </td>
                </tr>`;
            }

            tbody.innerHTML = html;

            // Função de exclusão (global)
            window.excluirItem = function(index) {
                if (index < 0 || index >= dados.length) return;
                const item = dados[index];
                const nome = item.cliente || 'Item';
                if (confirm(`⚠️ Excluir registro de "${nome}"?`)) {
                    dados.splice(index, 1);
                    try {
                        localStorage.setItem(chavePlanilha, JSON.stringify(dados));
                    } catch (e) {}
                    location.reload();
                }
            };

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
        });
    </script>
</body>
</html>
